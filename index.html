
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        h2 {
            color: #17365d;
            font-size: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .section {
            background: white;
            padding: 18px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .student {
            background: #f2f6fc;
            padding: 12px;
            margin: 10px 0;
            border-left: 4px solid #17365d;
            border-radius: 5px;
        }

        .grade {
            font-weight: bold;
            color: #176b3a;
        }

        .average {
            font-size: 25px;
            font-weight: bold;
            color: #176b3a;
        }

        ul {
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Records Manager</h1>

    <div class="section">
        <h2>All Students Records</h2>
        <div id="allStudents"></div>
    </div>

    <div class="section">
        <h2>Students Who Passed</h2>
        <div id="passedStudents"></div>
    </div>

    <div class="section">
        <h2>All Student Names</h2>
        <div id="studentNames"></div>
    </div>

    <div class="section">
        <h2>Average Score</h2>
        <p class="average" id="averageScore"></p>
    </div>

</div>

<script src="assignment.js"></script>

</body>
</html>
